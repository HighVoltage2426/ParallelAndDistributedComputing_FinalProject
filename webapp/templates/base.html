<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUEUE IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Karla:ital,wght@0,200..800;1,200..800&family=League+Spartan:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/styles.css" />
  </head>
  <body>
    <header>
      <h4>{{ header_title | default("HIGH-Q") }}</h4>
    </header>

    <div class="container">
      {% block content %}

      <div class="base_title">
        <h3>Welcome to WVSU Admin</h3>
        <p>Please select a service to join the queue.</p>
      </div>

      <div class="join_bbtn_container">
        <div class="selection-card">
          <form action="/qCashier" class="info-card-column" style="width: auto">
            <div class="card-title-status">
              <h2>Cashier</h2>
              <span class="live-status"
                >Live - <span>{{cashier_wait_count}}</span> waiting</span
              >
            </div>
            <button class="join_queue_bttn" type="submit">
              Join Queue
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="white"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
                />
              </svg>
            </button>
          </form>
          <img src="static/images/cash.png" width="135" />
        </div>

        <div class="selection-card">
          <form
            action="/qRegistrar"
            class="info-card-column"
            style="width: auto"
          >
            <div class="card-title-status">
              <h2>Registrar</h2>
              <span class="live-status">
                Live - <span>{{registrar_wait_count}}</span> waiting
              </span>
            </div>
            <button class="join_queue_bttn" type="submit">
              Join Queue
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
                />
              </svg>
            </button>
          </form>
          <img src="static/images/reg.png" width="135" />
        </div>
      </div>

      {% endblock %}
    </div>
  </body>
</html>
