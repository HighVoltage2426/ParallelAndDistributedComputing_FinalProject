<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEUE IT</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>
<body>
    <div class="container"> 
        {% block content %}

        <h1>Welcome to WVSU Admin</h1>
        <p>Please select a service to join the queue.</p> <br>

        <div class="join_bbtn_container">
            <form action="/qCashier" class="join_queue_bttn">
                <h2>Cashier</h2>
                <p>Live - <span>{{cashier_wait_count}}</span> waiting </p>
                <button type="submit">Join Queue </button>
            </form>

            <form action="/qRegistrar" class="join_queue_bttn">
                <h2>Registrar</h2>
                <p>Live - <span>{{registrar_wait_count}}</span> waiting </p>
                <button type="submit">Join Queue</button>
            </form>
        </div>
        
        {% endblock %}
    </div>
</body>
</html>
